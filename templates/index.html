<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourism Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">
    <style>
        .select2-container--default .select2-selection--single {
            height: 3rem;
            border-radius: 8px;
            padding: 0.5rem;
        }
    </style>
</head>
<body class="bg-cover bg-center h-screen flex flex-col items-center justify-center text-gray-800" style="background-image: url('/static/background_image.jpg');">
    
    <!-- Navbar -->
    <nav class="bg-black bg-opacity-70 text-white fixed top-0 left-0 w-full p-4 flex justify-between items-center shadow-lg">
        <div class="text-lg font-bold">Tourism Guide System</div>
        <div class="space-x-6">
            {% if session['user_id'] %}
                <a href="/index" class="hover:underline">Home</a>
                <a href="/logout" class="hover:underline">Logout</a>
                <a href="/booking_details" class="hover:underline">Booking Details</a>
            {% else %}
                <a href="/" class="hover:underline">Home</a>
                <a href="/login" class="hover:underline">Login</a>
                <a href="/register" class="hover:underline">Register</a>
            {% endif %}
        </div>
    </nav>

    <!-- Search Container -->
    <div class="bg-white bg-opacity-90 p-6 rounded-lg shadow-lg w-96 text-center mt-20">
        <h2 class="text-xl font-bold mb-4">Find Your Next Destination</h2>
        
        <label for="country-select" class="block text-left text-sm font-medium text-gray-700 mb-2">Search Country:</label>
        <select id="country-select" class="w-full border border-gray-300 rounded-lg px-3 py-2"></select>

        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg mt-4 transition-all" onclick="redirectToResults()">
            Get Recommendations
        </button>
    </div>

    <script>
    $(document).ready(function() {
        $('#country-select').select2({
            placeholder: "Search for a country...",
            width: '100%',
            ajax: {
                url: "/api/countries",
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return { term: params.term };
                },
                processResults: function (data) {
                    return { results: data.map(c => ({ id: c, text: c })) };
                }
            }
        });
    });

    function redirectToResults() {
        let country = $('#country-select').val();
        if (!country) {
            alert("Please select a country!");
            return;
        }
        window.location.href = `/api/recommendations?country=${country}`;
    }
    </script>

</body>
</html>
