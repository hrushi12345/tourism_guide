<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center h-screen flex justify-center items-center" style="background-image: url('/static/background_image.jpg');">
    
    <!-- Navbar -->
    <nav class="bg-black bg-opacity-70 text-white fixed top-0 left-0 w-full p-4 flex justify-between items-center">
        <div class="text-lg font-bold">Tourism Guide System</div>
        <div class="space-x-6">
            {% if session['user_id'] %}
                <a href="/index" class="hover:underline">Home</a>
                <a href="/logout" class="hover:underline">Logout</a>
                <a href="/booking_details" class="hover:underline">Booking Details</a>
            {% else %}
                <a href="/" class="hover:underline">Home</a>
                <a href="/login" class="hover:underline">Login</a>
                <a href="/register" class="hover:underline">Register</a>
            {% endif %}
        </div>
    </nav>
    
    <!-- Registration Form -->
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-center text-2xl font-bold mb-4">User Registration</h2>
        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block font-semibold">Name:</label>
                <input type="text" name="name" required class="w-full border border-gray-300 p-2 rounded">
            </div>
            <div>
                <label class="block font-semibold">Email:</label>
                <input type="email" name="email" required class="w-full border border-gray-300 p-2 rounded">
            </div>
            <div>
                <label class="block font-semibold">Age:</label>
                <input type="number" name="age" required class="w-full border border-gray-300 p-2 rounded">
            </div>
            <div>
                <label class="block font-semibold">Gender:</label>
                <select name="gender" required class="w-full border border-gray-300 p-2 rounded">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold">Password:</label>
                <input type="password" name="password" required class="w-full border border-gray-300 p-2 rounded">
            </div>
            <button type="submit" class="bg-blue-500 text-white w-full p-2 rounded hover:bg-blue-600">Register</button>
        </form>
    </div>
</body>
</html>
